<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HaizhuAntigravity</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <a class="skip" href="#main">跳到主内容</a>

  <div id="gate" class="wrap gate-shell hidden">
    <section class="mast" aria-hidden="false">
      <div class="kicker">Haizhu Console</div>
      <h1 class="wordmark">Anti<span>gravity</span></h1>
      <p>管理员密码进门。进去之后填邮箱、密码、2FA、代理，点火跑一次官方首登。</p>
    </section>
    <form id="gateForm" class="panel" onsubmit="submitGate(event)">
      <h2 id="gateTitle" class="section-title">管理员登录</h2>
      <p class="lede" id="gateHint">输入管理员密码进入激活台。</p>
      <div id="setupExtra" class="hidden">
        <div class="field">
          <label for="setupPassword">设置管理员密码</label>
          <input id="setupPassword" name="setupPassword" type="password" autocomplete="new-password" minlength="6" />
        </div>
        <div class="field">
          <label for="setupConfirm">再输入一次</label>
          <input id="setupConfirm" name="setupConfirm" type="password" autocomplete="new-password" minlength="6" />
        </div>
      </div>
      <div id="loginExtra">
        <div class="field">
          <label for="loginPassword">管理员密码</label>
          <input id="loginPassword" name="loginPassword" type="password" autocomplete="current-password" />
        </div>
      </div>
      <p class="alert" id="gateErr" role="alert"></p>
      <div class="gate-actions">
        <button class="btn-primary" id="gateBtn" type="submit">进入</button>
      </div>
    </form>
  </div>

  <div id="app" class="wrap hidden">
    <header class="topbar">
      <div>
        <div class="kicker">Haizhu Console</div>
        <h1 class="wordmark">Anti<span>gravity</span></h1>
        <p class="lede">填写账号后一键激活。过程日志钉在下面，跑起来不要关窗口。</p>
      </div>
      <div class="row-actions">
        <div class="status" id="statusPill"><i></i><span id="statusText">idle</span></div>
        <button class="btn-ghost" type="button" onclick="logout()">退出</button>
      </div>
    </header>

    <main id="main" class="stack">
      <section class="panel" aria-labelledby="composeTitle">
        <h2 id="composeTitle" class="section-title">投放账号</h2>
        <div class="compose">
          <div>
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="you@gmail.com" />
          </div>
          <div>
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Google 密码" />
          </div>
          <div>
            <label for="totp">2FA / TOTP</label>
            <input id="totp" name="totp" spellcheck="false" placeholder="Base32 或 otpauth://" />
          </div>
          <div>
            <label for="proxy">代理</label>
            <input id="proxy" name="proxy" placeholder="http://127.0.0.1:7890" />
          </div>
        </div>
        <div class="settings">
          <div>
            <label for="channel">浏览器</label>
            <select id="channel">
              <option value="chrome">chrome</option>
              <option value="msedge">msedge</option>
              <option value="chromium">chromium</option>
            </select>
          </div>
          <div>
            <label for="timeout">超时（秒）</label>
            <input id="timeout" type="number" min="30" max="600" value="180" />
          </div>
        </div>
        <p class="alert" id="formErr" role="alert"></p>
        <div class="actions">
          <button class="btn-ignite" id="igniteBtn" type="button" onclick="activateNow()">一键激活</button>
          <button class="btn-primary" type="button" onclick="addAccount()">加入队列</button>
          <button class="btn-stop" id="stopBtn" type="button" onclick="stopJob()">停止</button>
          <button class="btn-ghost" type="button" onclick="clearQueue()">清空队列</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="queueTitle">
        <h2 id="queueTitle" class="section-title">队列</h2>
        <p class="lede" id="meta">还没有账号。</p>
        <div style="overflow:auto">
          <table class="queue">
            <thead>
              <tr><th>邮箱</th><th>2FA</th><th>代理</th><th>状态</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <section class="panel" aria-labelledby="logTitle">
        <h2 id="logTitle" class="section-title">激活过程</h2>
        <pre class="log" id="logs" aria-live="polite">等待任务...</pre>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
